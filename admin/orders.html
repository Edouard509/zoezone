<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — ZOEZONE Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
</head>
<body class="admin-body">

  <div class="admin-shell">
    <div class="admin-sidebar">
      <div class="brand"><img src="../assets/logo-black.png" alt="ZOEZONE"></div>
      <nav>
        <a href="index.html" data-page="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="products.html" data-page="products.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          Products
        </a>
        <a href="orders.html" data-page="orders.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Orders
        </a>
        <a href="reviews.html" data-page="reviews.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
          Reviews
        </a>
        <a href="promo.html" data-page="promo.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2.5 12.5V2.5h10l8.09 8.09a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1.5"/></svg>
          Promo Codes
        </a>
        <a href="settings.html" data-page="settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="admin-who" id="adminWho">&nbsp;</div>
      <a href="#" class="signout-link" id="adminSignOut" style="padding:11px 12px;font-size:13px;font-weight:600;">Sign Out</a>
    </div>

    <div class="admin-main">
      <div class="admin-page-head">
        <div>
          <h1>Orders</h1>
          <div class="sub">Track incoming orders and update fulfillment status.</div>
        </div>
      </div>

      <div class="admin-table-wrap">
        <div class="admin-toolbar">
          <input type="text" id="searchInput" placeholder="Search order # or customer…">
          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <div class="spacer"></div>
          <span id="orderCount" style="font-size:12px;color:#888;"></span>
        </div>
        <table class="admin-table">
          <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Placed</th><th></th></tr></thead>
          <tbody id="ordersBody"><tr class="admin-empty-row"><td colspan="8">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ---------- ORDER DETAIL PANEL ---------- -->
  <div class="admin-panel-overlay" id="orderOverlay">
    <div class="admin-panel" style="max-width:560px;">
      <div class="admin-panel-head">
        <h2 id="orderPanelTitle">Order</h2>
        <button class="admin-panel-close" id="orderPanelCloseBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>
      <div id="orderDetailBody"></div>
      <div class="admin-panel-footer">
        <label style="font-size:12px;font-weight:700;margin-right:auto;align-self:center;">Status</label>
        <select id="orderStatusSelect" style="border:1px solid var(--line);padding:10px 12px;font-size:12.5px;border-radius:3px;">
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="admin-btn" id="updateStatusBtn">Update</button>
      </div>
    </div>
  </div>

  <script src="../js/admin-common.js"></script>
  <script>
    var allOrders = [];
    var currentOrderId = null;
    var STATUS_LABEL = { pending: 'Pending', confirmed: 'Confirmed', shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled' };
    var PAY_LABEL = { whatsapp: 'WhatsApp', moncash: 'MonCash', natcash: 'NatCash', paypal: 'PayPal', zelle: 'Zelle', cashapp: 'Cash App' };

    document.addEventListener('DOMContentLoaded', function () {
      ZZAdmin.init().then(function (admin) {
        if (!admin) return;
        loadOrders();
      });

      document.getElementById('orderPanelCloseBtn').addEventListener('click', closeOrderPanel);
      document.getElementById('orderOverlay').addEventListener('click', function (e) {
        if (e.target === e.currentTarget) closeOrderPanel();
      });
      document.getElementById('updateStatusBtn').addEventListener('click', handleStatusUpdate);
      document.getElementById('searchInput').addEventListener('input', renderTable);
      document.getElementById('statusFilter').addEventListener('change', renderTable);
    });

    function loadOrders() {
      ZZAdmin.api('/api/admin/orders').then(function (res) {
        if (!res.ok) {
          document.getElementById('ordersBody').innerHTML = '<tr class="admin-empty-row"><td colspan="8">Could not load orders.</td></tr>';
          return;
        }
        allOrders = res.data;
        renderTable();

        var params = new URLSearchParams(window.location.search);
        var wantId = params.get('id');
        if (wantId) openOrderPanel(wantId);
      });
    }

    function renderTable() {
      var q = document.getElementById('searchInput').value.trim().toLowerCase();
      var status = document.getElementById('statusFilter').value;

      var filtered = allOrders.filter(function (o) {
        var name = ((o.customer.firstName || '') + ' ' + (o.customer.lastName || '')).toLowerCase();
        if (q && o.id.toLowerCase().indexOf(q) === -1 && name.indexOf(q) === -1) return false;
        if (status && o.status !== status) return false;
        return true;
      });

      document.getElementById('orderCount').textContent = filtered.length + ' of ' + allOrders.length + ' orders';

      var body = document.getElementById('ordersBody');
      if (!filtered.length) {
        body.innerHTML = '<tr class="admin-empty-row"><td colspan="8">No orders match.</td></tr>';
        return;
      }

      body.innerHTML = filtered.map(function (o) {
        var date = new Date(o.createdAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        var name = ZZAdmin.escapeHTML(((o.customer.firstName || '') + ' ' + (o.customer.lastName || '')).trim() || '—');
        var itemCount = o.items.reduce(function (n, it) { return n + it.qty; }, 0);
        return (
          '<tr>' +
            '<td><a href="#" data-open="' + o.id + '" style="text-decoration:underline;">' + o.id + '</a></td>' +
            '<td>' + name + '</td>' +
            '<td>' + itemCount + ' item' + (itemCount === 1 ? '' : 's') + '</td>' +
            '<td>$' + o.total.toFixed(2) + '</td>' +
            '<td>' + (PAY_LABEL[o.payment.method] || o.payment.method) + '</td>' +
            '<td><span class="admin-badge status-' + o.status + '">' + (STATUS_LABEL[o.status] || o.status) + '</span></td>' +
            '<td>' + date + '</td>' +
            '<td><div class="admin-row-actions"><button type="button" data-open="' + o.id + '">View</button></div></td>' +
          '</tr>'
        );
      }).join('');

      body.querySelectorAll('[data-open]').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.preventDefault();
          openOrderPanel(el.dataset.open);
        });
      });
    }

    function openOrderPanel(id) {
      var o = allOrders.filter(function (x) { return x.id === id; })[0];
      if (!o) return;
      currentOrderId = id;
      document.getElementById('orderPanelTitle').textContent = 'Order ' + o.id;
      document.getElementById('orderStatusSelect').value = o.status;

      var date = new Date(o.createdAt).toLocaleString();
      var itemsHTML = o.items.map(function (it) {
        var variant = [it.size, it.color].filter(Boolean).join(' / ');
        return (
          '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;">' +
            '<span>' + it.qty + 'x ' + ZZAdmin.escapeHTML(it.name) + (variant ? ' <span style="color:#999;">(' + ZZAdmin.escapeHTML(variant) + ')</span>' : '') + '</span>' +
            '<span>$' + (it.price * it.qty).toFixed(2) + '</span>' +
          '</div>'
        );
      }).join('');

      var locationHTML = o.location
        ? '<a href="https://maps.google.com/?q=' + o.location.lat + ',' + o.location.lng + '" target="_blank" rel="noopener" style="text-decoration:underline;">View on map</a>'
        : '—';

      document.getElementById('orderDetailBody').innerHTML =
        '<div style="font-size:13px;color:#888;margin-bottom:18px;">Placed ' + date + '</div>' +
        '<div style="margin-bottom:20px;">' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:8px;">Customer</div>' +
          '<div style="font-size:14px;font-weight:600;">' + ZZAdmin.escapeHTML(((o.customer.firstName || '') + ' ' + (o.customer.lastName || '')).trim() || '—') + '</div>' +
          '<div style="font-size:13px;color:#555;margin-top:3px;">Email: ' + ZZAdmin.escapeHTML(o.customer.email || '—') + '</div>' +
          '<div style="font-size:13px;color:#555;margin-top:3px;">WhatsApp: ' + ZZAdmin.escapeHTML(o.customer.whatsapp || '—') + '</div>' +
          '<div style="font-size:13px;color:#555;margin-top:3px;">Address: ' + ZZAdmin.escapeHTML(o.customer.address || '—') + '</div>' +
          (o.customer.notes ? '<div style="font-size:13px;color:#555;margin-top:3px;">Notes: ' + ZZAdmin.escapeHTML(o.customer.notes) + '</div>' : '') +
          '<div style="font-size:13px;color:#555;margin-top:3px;">Location: ' + locationHTML + '</div>' +
        '</div>' +
        '<div style="margin-bottom:20px;">' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#888;margin-bottom:8px;">Items</div>' +
          itemsHTML +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>Subtotal</span><span>$' + o.subtotal.toFixed(2) + '</span></div>' +
        (o.promoDiscountAmount > 0 ? '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#1f8a45;"><span>Promo (' + ZZAdmin.escapeHTML(o.promoCode || '') + ')</span><span>-$' + o.promoDiscountAmount.toFixed(2) + '</span></div>' : '') +
        (o.referralDiscountAmount > 0 ? '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#1f8a45;"><span>Referral Discount</span><span>-$' + o.referralDiscountAmount.toFixed(2) + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>Shipping</span><span>$' + o.shipping.toFixed(2) + '</span></div>' +
        (o.paymentFeeAmount > 0 ? '<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;"><span>PayPal Fee</span><span>$' + o.paymentFeeAmount.toFixed(2) + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:8px 0;border-top:1px solid var(--line);margin-top:6px;"><span>Total</span><span>$' + o.total.toFixed(2) + '</span></div>' +
        '<div style="font-size:13px;color:#555;margin-top:10px;">Payment method: ' + (PAY_LABEL[o.payment.method] || o.payment.method) + '</div>';

      document.getElementById('orderOverlay').classList.add('open');
    }

    function closeOrderPanel() {
      document.getElementById('orderOverlay').classList.remove('open');
      currentOrderId = null;
      var url = new URL(window.location.href);
      url.searchParams.delete('id');
      window.history.replaceState({}, '', url);
    }

    function handleStatusUpdate() {
      if (!currentOrderId) return;
      var status = document.getElementById('orderStatusSelect').value;
      var btn = document.getElementById('updateStatusBtn');
      btn.disabled = true;
      btn.textContent = 'Updating…';
      ZZAdmin.api('/api/admin/orders/' + encodeURIComponent(currentOrderId), { method: 'PUT', body: JSON.stringify({ status: status }) })
        .then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Update';
          if (!res.ok) {
            ZZAdmin.showToast(res.data.error || 'Could not update status.');
            return;
          }
          ZZAdmin.showToast('Order status updated');
          closeOrderPanel();
          loadOrders();
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = 'Update';
          ZZAdmin.showToast("Couldn't reach the server — try again.");
        });
    }
  </script>
</body>
</html>
